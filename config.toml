# The URL the site will be built for
base_url = "https://www.raeburn.dk"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

theme = "ntun"

default_language = "en"
languages = []

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true

[extra]
# Put all your custom variables here
author = "Morten Raeburn"
author_image="me.jpg"
city="Aarhus, Denmark"
years="281"

job = "Computer Scientist"
description = "Student at Aarhus University"

links = [
    { url = "https://github.com/MortenRaeburn", title="Github", icon = "fab fa-github"},
    { url = "https://keybase.io/bouncedaddy69", title="Keybase", icon = "fab fa-keybase"},
    { url = "https://www.linkedin.com/in/morten-raeburn-a1420a1b8/", title="LinkedIn", icon = "fab fa-linkedin"},
    { url = "mailto:morten@raeburn.dk", title="morten@raeburn.dk", icon = "fas fa-envelope"}
]

# if you add languages, put your emoji flag on array
languages_flags = [
    "🇬🇧"
]
